name: Publish Linux preview

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish Linux preview
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Verify the release tag matches package.json
        run: |
          test "v$(node -e 'const fs = require("fs"); process.stdout.write(JSON.parse(fs.readFileSync("package.json", "utf8")).version)')" = "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri build

      - name: Generate checksums
        working-directory: src-tauri/target/release/bundle
        run: |
          sha256sum appimage/*.AppImage deb/*.deb rpm/*.rpm > "CaptureVault_${GITHUB_REF_NAME}_SHA256SUMS.txt"

      - name: Publish prerelease assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "CaptureVault $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Linux preview release. OCR is on-device; optional whole-image vision metadata is disabled by default and requires explicit opt-in. Windows and macOS capture adapters remain source-only experimental work pending native-device testing and signing. Snap Store publication has not happened yet." \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm \
            "src-tauri/target/release/bundle/CaptureVault_${GITHUB_REF_NAME}_SHA256SUMS.txt"
