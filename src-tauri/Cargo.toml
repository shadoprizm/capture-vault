[package]
name = "capture-vault"
version = "0.3.0"
description = "A private, local-first screenshot library"
authors = ["CaptureRecall contributors"]
edition = "2024"
license = "MIT"
repository = "https://github.com/shadoprizm/capture-vault"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "capture_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-drag = "2.1.1"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2.3.2"
chrono = { version = "0.4", features = ["serde"] }
clipboard-rs = { version = "0.3.5", features = ["wayland"] }
base64 = "0.23.1"
image = { version = "0.25", default-features = false, features = ["png"] }
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rten = { version = "0.26.0", default-features = false, features = ["mmap", "rten_format"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot"] }

[target.'cfg(target_os = "macos")'.dependencies]
# SCScreenshotManager is available on macOS 14.0 and later. Keeping this
# target-specific prevents the Swift bridge from affecting Linux and Windows.
screencapturekit = { version = "10.0.3", features = ["macos_14_0"] }
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
# Uses Windows.Graphics.Capture and the Win32 IGraphicsCaptureItemInterop API.
windows-capture = "2.0.1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
